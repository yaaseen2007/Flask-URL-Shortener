{% extends "base.html" %}

{% block title %}Login Page{% endblock %}

{% block content %}

<div class="container my-5">

    <h1>Login</h1>

    <form action="{{ url_for('login') }}" method="POST">

        <div class="mb-3">

            <label class="form-label" for="username">
                Username
            </label>

            <input
                type="text"
                name="username"
                class="form-control"
                id="username"
                required
            >

        </div>


        <div class="mb-3">

            <label class="form-label" for="password">
                Password
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                id="password"
                required
            >

        </div>


        <button type="submit" class="btn btn-primary">
            Login
        </button>

    </form>

</div>

{% endblock %}
